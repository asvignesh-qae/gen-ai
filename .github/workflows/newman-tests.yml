name: Newman API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Newman tests
        run: |
          npx newman run "week2/Week2-HA/groq.postman_collection.json" \
            -e "week2/Week2-HA/groq.postman_environment.json" \
            --env-var "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" \
            -r htmlextra \
            --reporter-htmlextra-export "./test-report.html" \
            --reporter-htmlextra-skipEnvironmentVars \
            --reporter-htmlextra-skipHeaders \
            --reporter-htmlextra-skipSensitiveData

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: week2/Week2-HA/test-report.html
          retention-days: 30
